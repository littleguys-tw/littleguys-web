<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<!-- 🔴 兩種 charset 寫法都要留:短寫法 IE7 不一定吃,少了會整頁亂碼 -->
<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
<meta charset="utf-8">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<title>小傢伙天堂</title>
<link rel="stylesheet" type="text/css" href="style.css">
</head>
<body>

<table class="page" cellspacing="0" cellpadding="0">
  <tr>
    <td class="brand">
      小傢伙天堂<br>
      <span class="sub">最後更新 2026-08-18</span>
    </td>
  </tr>
</table>

<!-- ══ 分頁 TAB(每頁都一樣,只有 class="on" 換位置)══ -->
<table class="tabs" cellspacing="0" cellpadding="0">
  <tr>
    <td class="on"><a href="index.html">首頁</a></td>
    <td><a href="play.html">玩法</a></td>
    <td><a href="pay.html">贊助</a></td>
    <td class="last"><a href="event.html">活動</a></td>
  </tr>
</table>

<table class="page" cellspacing="0" cellpadding="0">

  <!-- ══════════════════════════════════════════════════════
       ▼▼▼ 公告:這一段可以隨便改 ▼▼▼

       改的時候只動「中文字」,不要動 < > 裡面的東西。
         <p>  ...  </p>          = 一行公告,要加一行就整組複製
         <span class="hot">◆</span> = 橘色的菱形符號
         <span class="ok">字</span>  = 把「字」變成綠色
         <span class="dim">字</span> = 把「字」變成灰色小字
       最後一行的 <p> 要寫成 <p class="last">,它會少一點下面的空白。
       ══════════════════════════════════════════════════════ -->
  <tr><td class="sect">最新公告</td></tr>
  <tr>
    <td class="body">
      <p><span class="hot">◆</span> 週六 20:00 攻城戰,提前 30 分鐘開放進場。</p>
      <p><span class="hot">◆</span> 新增即時獎勵領取,推文獎勵找
         <span class="ok">獎勵使者</span> 領取。</p>
      <p class="last dim">公告只留最近三則。</p>
    </td>
  </tr>
  <!-- ▲▲▲ 公告改到這裡為止 ▲▲▲ -->

  <!-- ══════════════════════════════════════════════════════
       ▼▼▼ LINE 客服 ▼▼▼

       🔴 圖片要放進**同一個資料夾**,檔名 qr-line.png。
          IE7 不支援內嵌圖片,所以一定要獨立檔案。
          建議 180x180 以上,太小手機掃不到。
       下面那行 @littleguys 改成你自己的 LINE ID。
       ══════════════════════════════════════════════════════ -->
  <tr><td class="sect">LINE 客服</td></tr>
  <tr>
    <td class="qr">
      <img src="qr-line.png" alt="LINE 客服 QR CODE" width="180" height="180">
      <div class="qrcap">手機掃描加入 · 或搜尋 ID</div>
      <div class="qrid">@littleguys</div>
    </td>
  </tr>
  <!-- ▲▲▲ LINE 客服到這裡為止 ▲▲▲ -->

  <!-- 頁尾:文字可以改,<br> 是換行 -->
  <tr>
    <td class="foot">
      小傢伙天堂 &copy; 2026<br>
      有問題請加 LINE 客服,回覆時間 10:00 ~ 24:00。
    </td>
  </tr>

</table>

</body>
</html>
