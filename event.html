<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
<meta charset="utf-8">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<title>常駐活動 · 小傢伙天堂</title>
<link rel="stylesheet" type="text/css" href="style.css">
</head>
<body>

<table class="page" cellspacing="0" cellpadding="0">
  <tr>
    <td class="brand">
      常駐活動<br>
      <span class="sub">固定時間開放,不另行公告</span>
    </td>
  </tr>
</table>

<table class="tabs" cellspacing="0" cellpadding="0">
  <tr>
    <td><a href="index.html">首頁</a></td>
    <td><a href="play.html">玩法</a></td>
    <td><a href="pay.html">贊助</a></td>
    <td class="last on"><a href="event.html">活動</a></td>
  </tr>
</table>

<table class="page" cellspacing="0" cellpadding="0">

  <!-- ══════════════════════════════════════════════════════
       ▼▼▼ 活動時間表:改中文字就好 ▼▼▼

       每一列長這樣(整組複製就能多一列):
         <tr>
           <td class="k">左邊那格(時間)</td>
           <td class="v">右邊那格(內容)</td>
         </tr>
       最後一列要寫 <tr class="last">,它會少一條底線。
         <span class="num">字</span> = 金色(用在時間)
         <span class="ok">字</span>  = 綠色(用在強調好處)
       ══════════════════════════════════════════════════════ -->
  <tr><td class="sect">每日</td></tr>
  <tr>
    <td class="body">
      <table class="list" cellspacing="0" cellpadding="0">
        <tr>
          <td class="k"><span class="num">12:00</span></td>
          <td class="v">經驗加成 <span class="ok">+50%</span>,持續 2 小時</td>
        </tr>
        <tr>
          <td class="k"><span class="num">21:00</span></td>
          <td class="v">王者降臨 · 隨機地圖出現強力頭目</td>
        </tr>
        <tr class="last">
          <td class="k">整天</td>
          <td class="v">每日任務,完成可領獎勵</td>
        </tr>
      </table>
    </td>
  </tr>

  <tr><td class="sect">每週</td></tr>
  <tr>
    <td class="body">
      <table class="list" cellspacing="0" cellpadding="0">
        <tr>
          <td class="k"><span class="num">週六 20:00</span></td>
          <td class="v">攻城戰 · 提前 30 分鐘開放進場</td>
        </tr>
        <tr class="last">
          <td class="k"><span class="num">週日</span></td>
          <td class="v">限定地圖開放,活動王出現</td>
        </tr>
      </table>
    </td>
  </tr>

  <tr><td class="sect">不定期</td></tr>
  <tr>
    <td class="body">
      <p>推文獎勵、節日活動等會另外公告,獎勵請找
         <span class="ok">獎勵使者</span> 領取。</p>
      <p class="last dim">領過的不會重複發放,系統會記錄。</p>
    </td>
  </tr>

  <tr><td class="sect">提醒</td></tr>
  <tr>
    <td class="body">
      <p class="last"><span class="hot">◆</span>
         活動時間以<span class="ok">伺服器時間</span>為準,
         實際開放狀況以遊戲內公告為主。</p>
    </td>
  </tr>

  <tr>
    <td class="foot">
      小傢伙天堂 &copy; 2026<br>
      活動有異動會在首頁公告。
    </td>
  </tr>

</table>

</body>
</html>
